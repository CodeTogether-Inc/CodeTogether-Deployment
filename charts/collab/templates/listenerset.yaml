{{- $gwValues := .Values.gateway | default dict }}
{{- if and ($gwValues.listenerSet | default dict).enabled (not $gwValues.enabled) }}
{{- fail "gateway.listenerSet.enabled=true requires gateway.enabled=true: the ListenerSet carries the HTTPRoute's listener, and without the HTTPRoute nothing is rendered." }}
{{- end }}
{{- if eq (include "codetogether.listenerSetEnabled" .) "true" }}
{{- $ls := .Values.gateway.listenerSet }}
{{- $parent := $ls.parentRef | default dict }}
{{- if not $parent.name }}
{{- fail "gateway.listenerSet.enabled=true requires gateway.listenerSet.parentRef.name: the Gateway the ListenerSet adds a listener to." }}
{{- end }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/ListenerSet") }}
{{- fail "gateway.listenerSet.enabled=true but the cluster does not serve gateway.networking.k8s.io/v1 ListenerSet. Install Gateway API v1.5+ standard CRDs (or pass --api-versions gateway.networking.k8s.io/v1/ListenerSet to helm template)." }}
{{- end }}
# HTTPS listener for this release on the shared Gateway {{ $parent.name }}. With a
# cert-manager.io/(cluster-)issuer annotation, cert-manager issues the
# certificate into the Secret named below.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "codetogether.fullname" . }}
  labels:
    {{- include "codetogether.labels" . | nindent 4 }}
    {{- with $gwValues.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $ls.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    {{- toYaml $parent | nindent 4 }}
  listeners:
    - name: {{ $ls.listenerName | default "https" }}
      hostname: {{ include "codetogether.routeHostname" . | quote }}
      port: {{ $ls.port | default 443 }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $ls.tlsSecretName | default (printf "%s-tls" (include "codetogether.fullname" .)) }}
{{- end }}
