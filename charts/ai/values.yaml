# Default values for CodeTogether AI on Kubernetes.
# Based on charts/intel from CodeTogether-Deployment; adapted for the ct-ai
# codetogether-ai customer image and start-ctai entrypoint.
#
# Kubernetes required version: v1.19+
#
# Configuration modes (pick one):
#   1. Properties file (recommended):
#        helm install ctai . \
#          --set-file ctaiPropertiesFile=./ctai-configuration.properties
#   2. Pre-created Secret (GitOps):
#        ctaipropertiessecret.enabled=true, ctaipropertiessecret.ref=...
#   3. Env-only — leave properties empty; set service.fqdn and extraEnvVars.
nameOverride: ""
fullnameOverride: ""

image:
  repository: hub.edge.codetogether.com/releases/codetogether-ai
  pullPolicy: Always
  tag: "latest"
  digest: ""

imageCredentials:
  # pullSecret: "my-customer-pull-secret"
  enabled: true
  registry: hub.edge.codetogether.com
  username: "my-customer-username"
  password: "my-customer-password"
  email: unused

# Public HTTPS URL (same meaning as service_fqdn in ctai-configuration.properties).
# Optional when using --set-file: service_fqdn is read from the properties file
# instead. Required for GitOps (pre-created properties Secret) and env-only installs.
service:
  fqdn: ""
  annotations: {}
  type: ClusterIP
  port: 1080

# Properties file contents. Set at install time with --set-file:
#   --set-file ctaiPropertiesFile=./ctai-configuration.properties
ctaiPropertiesFile: ""

# Protected-storage master key — delivered via dedicated Secret as CTAI_PROTECTED_STORAGE_MASTER_KEY_B64,
# not in the properties file. Production workflow:
#   1. Run generate-master-key.sh on your workstation and kubectl apply the Secret.
#   2. Set masterKey.existingSecret to that Secret name (default: ctai-master-key).
masterKey:
  source: secret       # secret (production) | auto (dev only) | external (advanced — chart does not inject)
  existingSecret: ctai-master-key
  existingSecretKey: CTAI_PROTECTED_STORAGE_MASTER_KEY_B64
  existingSecretVersionKey: CTAI_PROTECTED_STORAGE_MASTER_KEY_VERSION
  # Used only when source=auto for non-production testing.
  masterKeyB64: ""
  masterKeyVersion: v1

# Use a pre-created Secret instead of chart-generated properties.
# Secret must contain key: ctai-configuration.properties
ctaipropertiessecret:
  enabled: false
  ref: ""

properties:
  # Matches Dockerfile layout and start-ctai CTAI_CONFIGURATION_HOME.
  mountPath: /opt/ctai/server/config
  fileName: ctai-configuration.properties

ingress:
  enabled: true
  annotations:
    # OTLP telemetry batches can exceed the nginx-ingress 1MB default body size
    # and get rejected with 413 before reaching the backend. Raise the limit so
    # tracker uploads land. The in-pod nginx already allows 32m, so the ingress
    # hop is the binding constraint. Additional ingress annotations
    # (e.g. external-dns hostname) merge with this default.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  # className: codetogether-nginx
  tls:
    secretName: codetogether-ai-tls

# Gateway API (gateway.networking.k8s.io/v1), for clusters that route with a
# Gateway instead of an Ingress controller (for example NGINX Gateway Fabric,
# replacing the retired ingress-nginx). Off by default.
#
# The chart attaches an HTTPRoute to a Gateway you already run; it does not
# create the Gateway, its listeners or its certificate. Set ingress.enabled=false
# when you switch, unless you deliberately run both during a migration.
gateway:
  enabled: false
  # Gateway(s) the HTTPRoute attaches to. Required when enabled. Example:
  #   parentRefs:
  #     - name: shared-gateway
  #       namespace: gateway-system
  #       sectionName: https   # the HTTPS listener that holds the certificate
  parentRefs: []
  annotations: {}
  labels: {}
  # NGINX Gateway Fabric only. Replaces the Ingress annotation
  # nginx.ingress.kubernetes.io/proxy-body-size: OTLP telemetry batches exceed
  # the 1MB default and would be rejected with 413 before reaching the backend.
  nginxGatewayFabric:
    clientSettingsPolicy:
      # auto: render only when the cluster serves
      #       gateway.nginx.org/v1alpha1 ClientSettingsPolicy
      # true: always render (e.g. `helm template` without cluster access)
      # false: never render (another Gateway API implementation)
      enabled: auto
      bodyMaxSize: "16m"

# Client address handling (X-Forwarded-For trust).
#
# The server counts proxies from the right-hand end of
# `X-Forwarded-For ++ [socket peer]` and records the entry just past the proxies
# it trusts. Set the count to exactly the proxies in front of the pod that you
# control and that append to X-Forwarded-For:
#
#   2  your Ingress controller or Gateway, plus the nginx inside the pod.
#      Correct for a stock Kubernetes install (the default).
#   3+ add one for each proxy in front that appends to X-Forwarded-For
#      (external load balancer, WAF, corporate reverse proxy).
#   1  nothing proxies in front of the Service (for example a LoadBalancer
#      Service reached directly, with no Ingress or Gateway).
#
# Match the real chain. Too low records one of your proxies' addresses. Too high
# reads past the client: if your outermost proxy keeps an incoming
# X-Forwarded-For (many Gateways append to it), that entry is whatever the
# client sent, so it can be spoofed. Only when the outermost proxy replaces the
# header does too high resolve to no address (recorded as degraded).
# Without this setting the server assumes 1 (Docker), and every address
# resolves to the Ingress controller or Gateway.
# A CTAI_INGEST_OTEL_TRUSTED_PROXY_HOPS entry in extraEnvVars takes precedence.
clientIp:
  trustedProxyHops: 2

serviceAccount:
  create: true
  annotations: {}
  name: "codetogether-ai"

podAnnotations: {}
podSecurityContext:
  fsGroup: 2200

securityContext:
  runAsNonRoot: true
  runAsUser: 2200
  runAsGroup: 2200
  allowPrivilegeEscalation: false

resources: {}

readinessProbe:
  path: /healthz
  port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 6

livenessProbe:
  path: /actuator/health
  port: backend
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 6

startupProbe:
  enabled: true
  path: /actuator/health
  port: backend
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30

initContainers: []
nodeSelector: {}
tolerations: []
affinity: {}
replicaCount: 1
# When false, Helm omits spec.replicas so external tools (HPA, kubectl scale,
# cluster automation) can own replica count without SSA conflicts on upgrade.
# Fresh installs still default to 1 pod when replicas is omitted.
manageReplicas: true

extraEnvVars: []
extraVolumes: []
extraVolumeMounts: []
extraContainers: []
