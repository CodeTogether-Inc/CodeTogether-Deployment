# Default values for CodeTogether AI on Kubernetes.
# Based on charts/intel from CodeTogether-Deployment; adapted for the ct-ai
# codetogether-ai customer image and start-ctai entrypoint.
#
# Kubernetes required version: v1.19+
#
# Configuration modes (pick one):
#   1. Properties file (recommended):
#        helm install ctai . \
#          --set-file ctaiPropertiesFile=./ctai-configuration.properties
#   2. Pre-created Secret (GitOps):
#        ctaipropertiessecret.enabled=true, ctaipropertiessecret.ref=...
#   3. Env-only — leave properties empty; set service.fqdn and extraEnvVars.
nameOverride: ""
fullnameOverride: ""

image:
  repository: hub.edge.codetogether.com/releases/codetogether-ai
  pullPolicy: Always
  tag: "latest"
  digest: ""

imageCredentials:
  # pullSecret: "my-customer-pull-secret"
  enabled: true
  registry: hub.edge.codetogether.com
  username: "my-customer-username"
  password: "my-customer-password"
  email: unused

# Public HTTPS URL (same meaning as service_fqdn in ctai-configuration.properties).
# Optional when using --set-file: service_fqdn is read from the properties file
# instead. Required for GitOps (pre-created properties Secret) and env-only installs.
service:
  fqdn: ""
  annotations: {}
  type: ClusterIP
  port: 1080

# Properties file contents. Set at install time with --set-file:
#   --set-file ctaiPropertiesFile=./ctai-configuration.properties
ctaiPropertiesFile: ""

# Protected-storage master key — delivered via dedicated Secret as CTAI_PROTECTED_STORAGE_MASTER_KEY_B64,
# not in the properties file. Production workflow:
#   1. Run generate-master-key.sh on your workstation and kubectl apply the Secret.
#   2. Set masterKey.existingSecret to that Secret name (default: ctai-master-key).
masterKey:
  source: secret       # secret (production) | auto (dev only) | external (advanced — chart does not inject)
  existingSecret: ctai-master-key
  existingSecretKey: CTAI_PROTECTED_STORAGE_MASTER_KEY_B64
  existingSecretVersionKey: CTAI_PROTECTED_STORAGE_MASTER_KEY_VERSION
  # Used only when source=auto for non-production testing.
  masterKeyB64: ""
  masterKeyVersion: v1

# Use a pre-created Secret instead of chart-generated properties.
# Secret must contain key: ctai-configuration.properties
ctaipropertiessecret:
  enabled: false
  ref: ""

properties:
  # Matches Dockerfile layout and start-ctai CTAI_CONFIGURATION_HOME.
  mountPath: /opt/ctai/server/config
  fileName: ctai-configuration.properties

ingress:
  enabled: true
  annotations:
    # OTLP telemetry batches can exceed the nginx-ingress 1MB default body size
    # and get rejected with 413 before reaching the backend. Raise the limit so
    # tracker uploads land. The in-pod nginx already allows 32m, so the ingress
    # hop is the binding constraint. Additional ingress annotations
    # (e.g. external-dns hostname) merge with this default.
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  # className: codetogether-nginx
  tls:
    secretName: codetogether-ai-tls

# Gateway API (gateway.networking.k8s.io/v1), for clusters that route with a
# Gateway instead of an Ingress controller (for example NGINX Gateway Fabric,
# replacing the retired ingress-nginx). Off by default.
#
# The chart attaches an HTTPRoute to a Gateway you already run; it does not
# create the Gateway, its listeners or its certificate. Set ingress.enabled=false
# when you switch, unless you deliberately run both during a migration.
gateway:
  enabled: false
  # Gateway(s) the HTTPRoute attaches to. Required when enabled. Example:
  #   parentRefs:
  #     - name: shared-gateway
  #       namespace: gateway-system
  #       sectionName: https   # the HTTPS listener that holds the certificate
  parentRefs: []
  annotations: {}
  labels: {}
  # NGINX Gateway Fabric only. Replaces the Ingress annotation
  # nginx.ingress.kubernetes.io/proxy-body-size: OTLP telemetry batches exceed
  # the 1MB default and would be rejected with 413 before reaching the backend.
  nginxGatewayFabric:
    clientSettingsPolicy:
      # auto: render only when the cluster serves
      #       gateway.nginx.org/v1alpha1 ClientSettingsPolicy
      # true: always render (e.g. `helm template` without cluster access)
      # false: never render (another Gateway API implementation)
      enabled: auto
      bodyMaxSize: "16m"
  # Optional ListenerSet (gateway.networking.k8s.io/v1): adds this release's
  # HTTPS listener (the service_fqdn host and its certificate) to a shared Gateway, so the
  # shared Gateway doesn't need a listener edited for each application. The
  # Gateway must allow it (spec.allowedListeners). When enabled and parentRefs
  # is empty, the HTTPRoute attaches to this ListenerSet.
  listenerSet:
    enabled: false
    # The Gateway this ListenerSet adds a listener to. Required when enabled.
    # Example:
    #   parentRef:
    #     name: gateway-ngf
    #     namespace: kube-system
    parentRef: {}
    listenerName: https
    port: 443
    # cert-manager reads these (cert-manager.io/cluster-issuer or
    # cert-manager.io/issuer) and issues the certificate into tlsSecretName.
    annotations: {}
    # TLS Secret in the release namespace. Defaults to <release fullname>-tls.
    tlsSecretName: ""

# Client address handling (X-Forwarded-For trust).
#
# The server counts proxies from the right-hand end of
# `X-Forwarded-For ++ [socket peer]` and records the entry just past the proxies
# it trusts. Set the count to exactly the proxies in front of the pod that you
# control and that append to X-Forwarded-For:
#
#   2  your Ingress controller or Gateway, plus the nginx inside the pod.
#      Correct for a stock Kubernetes install (the default).
#   3+ add one for each proxy in front that appends to X-Forwarded-For
#      (external load balancer, WAF, corporate reverse proxy).
#   1  nothing proxies in front of the Service (for example a LoadBalancer
#      Service reached directly, with no Ingress or Gateway).
#
# Match the real chain. Too low records one of your proxies' addresses. Too high
# reads past the client: if your outermost proxy keeps an incoming
# X-Forwarded-For (many Gateways append to it), that entry is whatever the
# client sent, so it can be spoofed. Only when the outermost proxy replaces the
# header does too high resolve to no address (recorded as degraded).
# Without this setting the server assumes 1 (Docker), and every address
# resolves to the Ingress controller or Gateway.
# A CTAI_INGEST_OTEL_TRUSTED_PROXY_HOPS entry in extraEnvVars takes precedence.
clientIp:
  trustedProxyHops: 2

serviceAccount:
  create: true
  annotations: {}
  name: "codetogether-ai"

podAnnotations: {}
podSecurityContext:
  fsGroup: 2200

securityContext:
  runAsNonRoot: true
  runAsUser: 2200
  runAsGroup: 2200
  allowPrivilegeEscalation: false
  # The image's own files are read-only; the directories it writes are the
  # writableDirectories below. false restores the previous layout (no
  # writableDirectories, the container writes to its own layer), for a pre-start
  # hook that writes elsewhere. Images older than the first one that supports it
  # (see "Read-only root filesystem" in README.md) always get the previous layout
  # when image.tag names a version.
  readOnlyRootFilesystem: true

# The directories the container writes, each an emptyDir mounted over the image's
# empty directory, so the root filesystem can be read-only. Mounted only when
# securityContext.readOnlyRootFilesystem is in effect. They live as long as the pod:
# a container restart keeps them (and reuses the unpacked artifacts), a new pod
# starts empty. Set enabled: false on one to mount your own volume there instead
# (a PVC on logs, for example) through extraVolumes and extraVolumeMounts; the
# chart refuses two volumes on the same path, and a disabled directory with no
# volume of yours on it. sizeLimit (for example 2Gi) caps one: the kubelet evicts
# the pod when it is exceeded, so leave it empty unless the node's ephemeral
# storage needs protecting.
writableDirectories:
  # Artifacts unpacked from artifacts.zip at start, with the server URL injected
  # into the IDE plugins (about 200 MB), and the YAML generated from the
  # properties file.
  runtime:
    enabled: true
    mountPath: /opt/ctai/runtime
    sizeLimit: ""
  # nginx's document root: the portal and metric lineage, unpacked at start.
  www:
    enabled: true
    mountPath: /opt/ctai/www
    sizeLimit: ""
  # server.log, the nginx logs and heap dumps (only the newest is kept).
  logs:
    enabled: true
    mountPath: /opt/ctai/logs
    sizeLimit: ""
  # nginx's pid file and request-body and proxy temp files.
  tmp:
    enabled: true
    mountPath: /opt/ctai/tmp
    sizeLimit: ""
  # The JVM's and Tomcat's temp files.
  systemTmp:
    enabled: true
    mountPath: /tmp
    sizeLimit: ""

resources: {}

readinessProbe:
  path: /healthz
  port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 6

livenessProbe:
  path: /actuator/health
  port: backend
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 6

startupProbe:
  enabled: true
  path: /actuator/health
  port: backend
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30

initContainers: []
nodeSelector: {}
tolerations: []
affinity: {}
replicaCount: 1

# Rollout strategy. The default stops the old pod before it starts the new one
# (a short outage on a single replica), instead of the Kubernetes default
# (maxSurge 25%, which rounds up to one extra pod). Pods of one release share an
# embedded Hazelcast cluster, and a pod only joins a cluster of its own
# Hazelcast minor version: when a release changes that version, an old pod still
# running makes the new pod fail to join and restart in a loop, so a surge
# rollout never completes. With more than one replica, upgrade across a
# Hazelcast version with Recreate (see "Upgrade" in README.md):
#   --set deploymentStrategy.type=Recreate --set deploymentStrategy.rollingUpdate=null
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

extraEnvVars: []
extraVolumes: []
extraVolumeMounts: []
extraContainers: []
