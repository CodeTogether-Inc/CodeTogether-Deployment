name: Helm Template Validation

on:
  pull_request:
    branches: [main, dev]

jobs:
  helm-lint:
    name: Validate Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Required Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y unzip

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Validate Collab Chart
        run: |
          helm template collab ./charts/collab --values ./charts/collab/values.yaml

      - name: Validate HQ Chart
        run: |
          helm template hq ./charts/hq --values ./charts/hq/values.yaml

      - name: Validate Intel Chart
        run: |
          helm template intel ./charts/intel --values ./charts/intel/values.yaml

      - name: Validate AI Chart
        run: |
          helm lint ./charts/ai
          helm template test ./charts/ai \
            --set-file ctaiPropertiesFile=./charts/ai/ctai-configuration.properties.template \
            --set service.fqdn=https://example.codetogether.io \
            --set imageCredentials.username=test \
            --set imageCredentials.password=test
          helm template test ./charts/ai \
            --set-file ctaiPropertiesFile=./charts/ai/ctai-configuration.properties.template \
            --set service.fqdn=https://example.codetogether.io \
            --set imageCredentials.username=test \
            --set imageCredentials.password=test \
            --set ingress.enabled=false \
            --set gateway.enabled=true \
            --set 'gateway.parentRefs[0].name=shared-gateway' \
            --set 'gateway.parentRefs[0].namespace=gateway-system' \
            --api-versions gateway.networking.k8s.io/v1/HTTPRoute \
            --api-versions gateway.nginx.org/v1alpha1/ClientSettingsPolicy

      - name: Validate Live Chart
        run: |
          helm template live ./charts/live --values ./charts/live/values.yaml
